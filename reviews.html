<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅人評價 | 墨狐酒館</title>
    <link rel="icon" type="image/png" href="images/mofox-logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Handlee&display=swap" rel="stylesheet">
    
    <style>
        body {
            color: #ffffff; 
            font-family: 'Avenir', 'Georgia', serif; 
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            background-color: #1a1a1a;
            background-image: url('images/mofox-background.jpg'); 
            background-size: cover; 
            background-position: center center; 
            background-attachment: fixed; 
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px); 
            z-index: -2; 
        }

        .nav-bar {
            width: 100%;
            background-color: rgba(0, 0, 0, 0.3); 
            padding: 10px 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            z-index: 100;
        }
        
        .nav-link {
            text-decoration: none;
            color: #ffcc66;
            font-weight: bold;
            padding: 8px 15px;
            margin: 0 15px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .nav-link:hover {
            background-color: #ff8c42;
            color: #ffffff;
        }

        #float-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .review-card {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 204, 102, 0.3);
            padding: 15px;
            border-radius: 15px;
            width: 250px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            animation: float linear infinite;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            opacity: 0.8;
        }

        .user-info {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 10px;
            border: 2px solid #ffcc66;
        }

        .nickname {
            color: #ffcc66;
            font-weight: bold;
            font-size: 0.9em;
        }

        .stars {
            color: #ff8c42;
            font-size: 0.8em;
            margin-bottom: 5px;
        }

        .comment {
            font-size: 0.85em;
            line-height: 1.4;
            text-align: left;
            color: #eee;
        }

        @keyframes float {
            from { transform: translate(0, 0); }
            to { transform: translate(var(--move-x), var(--move-y)); }
        }

        header {
            width: 90%;
            padding: 50px 0 20px;
        }

        h1 {
            font-size: 3em;
            color: #ffe6c7;
            font-family: 'Handlee', cursive;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }

        .main-content {
            z-index: 10;
            background: rgba(0, 0, 0, 0.4);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 204, 102, 0.2);
            max-width: 600px;
        }

        .join-button {
            display: inline-block;
            padding: 15px 35px;
            background-color: #ff8c42;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        }

        .join-button:hover {
            transform: translateY(-5px);
            background-color: #ff703f;
        }

        footer {
            margin-top: auto;
            padding: 20px;
            color: #ffcc66;
            font-size: 0.9em;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="index.html" class="nav-link">酒館主頁</a>
        <a href="staff.html" class="nav-link">館員團隊</a>
        <a href="history.html" class="nav-link">歷程回顧</a>
        <a href="reviews.html" class="nav-link active">旅人評價</a>
    </div>

    <div id="float-container"></div>

    <header>
        <h1>旅人的私語</h1>
        <p style="color: #ffcc66;">這裡記錄了每一位訪客留下的溫度...</p>
    </header>

    <main class="main-content">
        <h2 style="color: #ff8c42;">留下你的足跡</h2>
        <p>在墨狐酒館，你的故事不曾被遺忘。<br>每一個靈魂的碰撞，都是我們存在的意義。</p>
        <div style="margin-top: 30px;">
            <a href="https://discord.gg/EECnvFZHpR" target="_blank" class="join-button">
                🦊 分享你的評價 🥂
            </a>
        </div>
    </main>

    <footer>
        墨狐酒館 | 「一杯曖昧，讓靈魂在迷霧中自由共醉」
    </footer>

    <script>
        const reviews = [
            { name: "迷途旅人", avatar: "https://cdn.discordapp.com/embed/avatars/0.png", stars: 5, text: "這裡的氛圍真的好讚，放鬆聊天的首選。" },
            { name: "深夜貓貓", avatar: "https://cdn.discordapp.com/embed/avatars/1.png", stars: 4, text: "分區做得很用心，管理員很有溫度。" },
            { name: "狐狸大叔", avatar: "https://cdn.discordapp.com/embed/avatars/2.png", stars: 5, text: "酒館的音樂很好聽，在那裡待了一整晚。" },
            { name: "夢遊者", avatar: "https://cdn.discordapp.com/embed/avatars/3.png", stars: 5, text: "神祕區域真的很有趣...會再來！" },
            { name: "小酒鬼", avatar: "https://cdn.discordapp.com/embed/avatars/4.png", stars: 3, text: "雖然有點害羞，但大家人都很好。" },
            { name: "靈魂探險家", avatar: "https://cdn.discordapp.com/embed/avatars/5.png", stars: 5, text: "在這裡找到了久違的共鳴感。" }
        ];

        function createFloatingReview() {
            const container = document.getElementById('float-container');
            
            reviews.forEach((data, index) => {
                const card = document.createElement('div');
                card.className = 'review-card';
                
                const startX = Math.random() * window.innerWidth;
                const startY = Math.random() * window.innerHeight;
                
                const moveX = (Math.random() - 0.5) * 400 + 'px';
                const moveY = (Math.random() - 0.5) * 400 + 'px';
                
                const duration = 15 + Math.random() * 20 + 's';
                
                card.style.left = `${startX}px`;
                card.style.top = `${startY}px`;
                card.style.setProperty('--move-x', moveX);
                card.style.setProperty('--move-y', moveY);
                card.style.animationDuration = duration;
                card.style.animationIterationCount = 'infinite';
                card.style.animationDirection = 'alternate';

                const starHTML = '⭐'.repeat(data.stars);

                card.innerHTML = `
                    <div class="user-info">
                        <img src="${data.avatar}" class="avatar" alt="avatar">
                        <span class="nickname">${data.name}</span>
                    </div>
                    <div class="stars">${starHTML}</div>
                    <div class="comment">${data.text}</div>
                `;

                container.appendChild(card);
            });
        }

        window.onload = createFloatingReview;
    </script>
</body>
</html>
