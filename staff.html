<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>館員團隊 | 墨狐酒館</title>
    <link rel="icon" type="image/png" href="images/mofox-logo.png">
    
    <style>
        :root {
            --accent-gold: #ffcc66;
            --hover-gold: #ff8c42;
            --bg-overlay: rgba(0, 0, 0, 0.4);
            --card-bg: rgba(255, 255, 255, 0.15);
        }

        body {
            color: #ffffff; 
            font-family: 'Avenir', 'Georgia', serif; 
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            position: relative; 
            background-image: url('images/mofox-background.jpg'); 
            background-size: cover; 
            background-position: center center; 
            background-attachment: fixed; 
        }

        body::before {
            content: '';
            position: fixed; 
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-overlay); 
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px); 
            z-index: -1; 
        }

        .login-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .auth-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 15px;
            background-color: #000; /* 完全黑底 */
            color: var(--accent-gold); /* 金字 */
            border: 1px solid var(--accent-gold); /* 金邊 */
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9em;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
            transition: all 0.3s;
            min-width: 130px;
        }

        .auth-btn:hover {
            background-color: var(--accent-gold);
            color: #000;
            transform: scale(1.05);
        }

        .auth-btn img {
            width: 18px;
            height: 18px;
            margin-right: 8px;
        }

        .nav-bar {
            width: 100%;
            background-color: rgba(0, 0, 0, 0.2); 
            padding: 10px 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
        }
        
        .nav-link {
            text-decoration: none;
            color: var(--accent-gold);
            font-weight: bold;
            font-size: 1.1em;
            padding: 8px 15px;
            margin: 0 15px;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .nav-link:hover {
            background-color: var(--hover-gold);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .nav-link.active {
            background-color: #cc6600;
            color: #ffffff;
            border-bottom: 2px solid var(--accent-gold);
        }

        .page-title {
            color: #ffe6c7;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.7);
            font-family: 'Handlee', cursive;
            font-size: 2.5em;
            margin: 30px 0;
            transition: transform 0.25s;
        }
        
        .page-title:hover { transform: scale(1.05); }

        .staff-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            width: 90%;
            max-width: 1000px;
            margin-bottom: 40px;
        }

        .staff-member {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            width: 240px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.25s;
            border: 1px solid rgba(255, 204, 102, 0.1);
        }
        
        .staff-member:hover { transform: scale(1.03); }

        .staff-member img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--accent-gold);
            margin-bottom: 15px;
        }
        
        .staff-member h4 {
            color: var(--hover-gold);
            font-size: 1.6em;
            margin: 5px 0 10px;
        }

        .quote {
            color: var(--accent-gold); 
            font-style: italic;
            margin: 5px 0;
            font-size: 0.9em; 
        }

        .staff-member p {
            font-size: 0.95em;
            line-height: 1.5;
            color: #ffffff; 
        }

        footer {
            margin-top: auto;
            padding: 20px;
            color: var(--accent-gold);
            font-style: italic;
            font-size: 0.8em;
            opacity: 0.7;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Handlee&display=swap" rel="stylesheet">
</head>
<body>

    <div class="login-container">
        <a href="https://mofox.xyz/api/auth/google" class="auth-btn">
            <img src="https://www.google.com/favicon.ico" alt="Google Icon" style="filter: grayscale(1) brightness(2);">
            Google 登入
        </a>
        <a href="/api/auth" class="auth-btn">
            <img src="images/mofox-logo.png" alt="Discord Icon">
            Discord 登入
        </a>
    </div>

    <div class="nav-bar">
        <a href="index.html" class="nav-link">酒館主頁</a>
        <a href="staff.html" class="nav-link active">館員團隊</a>
        <a href="history.html" class="nav-link">歷程回顧</a>
        <a href="reviews.html" class="nav-link">旅客評價</a>
        <a href="feedback.html" class="nav-link">用戶回饋</a>
    </div>

    <h2 class="page-title">墨狐酒館 - 團隊介紹</h2>
    
    <main>
        <div class="staff-container">
            
            <div class="staff-member">
                <img src="https://i.ibb.co/HD99KRhw/9eeb6a8437a41c27.jpg" alt="館主 墨狐">
                <h4>館主-墨狐</h4>
                <p class="quote">一隻可愛小狐狸(⁠´⁠∩⁠｡⁠•⁠ ⁠ᵕ⁠ ⁠•⁠｡⁠∩⁠`⁠)</p>
                <p class="quote">酒館最讚的姐姐</p>
                <p>酒館的創始人，以其溫暖與神秘的氣質，為迷途的旅人提供安心的驛站。</p>
            </div>

            <div class="staff-member">
                <img src="https://i.ibb.co/WNSj65DK/2023-2-1-1.png" alt="館員 2023">
                <h4>館員-2023</h4>
                <p class="quote">酒館資深開發者。</p>
                <p>負責酒館的各種活動規劃與項目開發。是酒館運作背後，不可或缺的技術核心。</p>
            </div>

            <div class="staff-member">
                <img src="https://i.ibb.co/Qj9JGW0T/imag2e.png" alt="館員 嵐">
                <h4>館員-嵐</h4>
                <p class="quote">定居酒館的重度沉迷者。</p>
                <p>酒館中的氣氛營造者，熱衷於與人交流，總是能帶來歡樂的特調和輕鬆的氛圍。</p>
            </div>

            <div class="staff-member">
                <img src="https://cdn.discordapp.com/avatars/964849855396741130/39c6a0d40e6386c65f65ea8d5fa1e058.png?size=1024" alt="館員 草薙明音">
                <h4>館員-草薙明音</h4>
                <p class="quote">可愛的貓貓。</p>
                <p>早安安，世界上最可愛的貓貓在這裡~~~</p>
            </div>

        </div>
    </main>
</body>
</html>
