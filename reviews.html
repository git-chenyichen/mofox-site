<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅客私語 | 墨狐酒館</title>
    <link rel="icon" type="image/png" href="images/mofox-logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Handlee&display=swap" rel="stylesheet">
    
    <style>
        body {
            color: #ffffff; 
            font-family: 'Avenir', 'Georgia', serif; 
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            background-image: url('images/mofox-background.jpg'); 
            background-size: cover; 
            background-position: center center; 
            background-attachment: fixed; 
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px); 
            z-index: -2; 
        }

        .nav-bar {
            width: 100%;
            background-color: rgba(0, 0, 0, 0.2); 
            padding: 10px 0;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            order: -1; 
        }
        
        .nav-link {
            text-decoration: none;
            color: #ffcc66;
            font-weight: bold;
            font-size: 0.9em;
            padding: 6px 12px;
            margin: 0 10px;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s, transform 0.3s;
        }

        .nav-link.active {
            background-color: #cc6600;
            color: #ffffff;
            border-bottom: 2px solid #ffcc66;
        }

        .display-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        .review-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 204, 102, 0.2);
            padding: 30px;
            border-radius: 20px;
            width: 500px; 
            min-height: 250px; 
            display: flex;
            flex-direction: column;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            transition: all 0.5s ease-in-out;
        }

        .fade-animation {
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-info {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 15px;
            border: 2px solid #ffcc66;
            object-fit: cover;
        }

        .nickname {
            color: #ffcc66;
            font-weight: bold;
            font-size: 1.2em;
        }

        .star-container {
            font-size: 1.3em;
            letter-spacing: 2px;
            margin-bottom: 12px;
            line-height: 1;
        }

        .star-fill {
            color: #ff8c42;
        }

        .star-empty {
            color: rgba(255, 255, 255, 0.1);
        }

        .comment {
            font-size: 1em;
            line-height: 1.7;
            text-align: left;
            color: #eeeeee;
            white-space: pre-line; 
            word-wrap: break-word;
        }

        header {
            margin-top: 40px;
            z-index: 10;
            text-align: center;
        }

        h1 {
            font-size: 2.2em;
            color: #ffe6c7;
            font-family: 'Handlee', cursive;
            margin-bottom: 5px;
        }

        footer {
            position: fixed;
            bottom: 20px;
            color: #ffcc66;
            font-size: 0.8em;
            font-style: italic;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="index.html" class="nav-link">酒館主頁</a>
        <a href="staff.html" class="nav-link">館員團隊</a>
        <a href="history.html" class="nav-link">歷程回顧</a>
        <a href="reviews.html" class="nav-link active">旅客評價</a>
    </div>

    <div class="display-wrapper">
        <div id="card-content" class="review-card"></div>
    </div>

    <header>
        <h1>旅客的私語</h1>
    </header>

    <footer>
        墨狐酒館 | Since 2025.06.09
    </footer>

    <script>
        const reviews = [
            {
                name: "館主- 墨狐",
                avatar: "https://cdn.discordapp.com/avatars/1367782120403238923/d309d8768a8c6a71aba1421375bb9b32.png?size=1024",
                stars: 5,
                text: "這是一間隱藏在塵世喧囂中的小酒館。\n\n有時人聲鼎沸、有時靜謐溫馨；\n有時歌聲悠揚、有時也會跑出奇特的聲音(？)。\n\n這裡的人們溫暖包容、多元接納，\n除了人類之外，亦存在著各種族 (w)。\n\n從小心翼翼地探頭，到像在家一般自在。\n\n歡迎光臨 —— 墨狐酒館"
            },
            { 
                name: "館員- 2023", 
                avatar: "https://cdn.discordapp.com/avatars/1191200148357910538/9066b691c0b376209b51833a4de5b1ac.png?size=1024", 
                stars: 5, 
                text: "這裡的氛圍真的好讚，\n放鬆聊天的首選。" 
            },
            { 
                name: "Ting", 
                avatar: "https://cdn.discordapp.com/avatars/906520363012325387/e287f972fdcf19867bfcd6fd1818577c.png?size=1024", 
                stars: 5, 
                text: "這是一個很溫暖每個人類都很友好的地方！\n也是一個治療心靈的好地方。" 
            },
            { name: "test3", avatar: "https://cdn.discordapp.com/embed/avatars/3.png", stars: 5, text: "3" },
            { name: "test4", avatar: "https://cdn.discordapp.com/embed/avatars/4.png", stars: 4, text: "4" },
            { name: "test5", avatar: "https://cdn.discordapp.com/embed/avatars/5.png", stars: 5, text: "5" },
            { name: "test6", avatar: "https://cdn.discordapp.com/embed/avatars/0.png", stars: 5, text: "6" }
        ];

        let currentIndex = 0;

        function getStars(count) {
            let starsHTML = '<span class="star-fill">';
            for (let i = 0; i < count; i++) starsHTML += '★';
            starsHTML += '</span><span class="star-empty">';
            for (let i = 0; i < (5 - count); i++) starsHTML += '★';
            starsHTML += '</span>';
            return starsHTML;
        }

        function updateDisplay() {
            const data = reviews[currentIndex];
            const container = document.getElementById('card-content');
            
            container.classList.remove('fade-animation');
            void container.offsetWidth; 
            container.classList.add('fade-animation');

            container.innerHTML = `
                <div class="user-info">
                    <img src="${data.avatar}" class="avatar">
                    <span class="nickname">${data.name}</span>
                </div>
                <div class="star-container">${getStars(data.stars)}</div>
                <div class="comment">${data.text}</div>
            `;
            
            currentIndex = (currentIndex + 1) % reviews.length;
        }

        updateDisplay();
        setInterval(updateDisplay, 5000);
    </script>
</body>
</html>
