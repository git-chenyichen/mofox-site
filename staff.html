 <!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>館員團隊 | 墨狐酒館</title>
    <link rel="icon" type="image/png" href="images/mofox-logo.png">
    
    <style>
        
        body {
            color: #ffffff; 
            font-family: 'Avenir', 'Georgia', serif; 
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            position: relative; 
            

            background-image: url('images/mofox-background.jpg'); 
            background-size: cover; 
            background-position: center center; 
            background-attachment: fixed; 
        }
        

        body::before {
            content: '';
            position: fixed; 
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4); 
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px); 
            z-index: -1; 
        }


        .login-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100; 
        }

        .discord-login-btn {
            display: inline-flex;
            align-items: center;
            padding: 10px 15px;
            background-color; 
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1em;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
            transition: background-color 0.3s, transform 0.2s;
        }

        .discord-login-btn:hover {
            background-color: #677BC4;
            transform: scale(1.05);
        }

        .discord-login-btn img {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            vertical-align: middle;

        }

        .nav-bar {
            width: 100%;
            background-color: rgba(0, 0, 0, 0.2); 
            padding: 10px 0;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            order: -1; 
        }
        
        .nav-link {
            text-decoration: none;
            color: #ffcc66;
            font-weight: bold;
            font-size: 1.1em;
            padding: 8px 15px;
            margin: 0 15px;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s, transform 0.3s;
        }

        .nav-link:hover {
            background-color: #ff8c42;
            color: #ffffff;
            transform: scale(1.05) translateY(-1px);
        }

        .nav-link.active {
            background-color: #cc6600;
            color: #ffffff;
            border-bottom: 2px solid #ffcc66;
        }

        .page-title {
            color: #ffe6c7;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.7);
            font-family: 'Handlee', cursive;
            font-size: 2.5em;
            margin-bottom: 30px;
            margin-top: 30px;
            display: inline-block; 
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .page-title:hover {
            transform: scale(1.05) translateY(-2px);
            cursor: default;
        }


        .staff-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            width: 90%;
            max-width: 900px;
            margin-bottom: 40px;
        }


        .staff-member {
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 20px;
            width: 250px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);

            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .staff-member:hover {
            transform: scale(1.03);
            cursor: pointer;
        }

        .staff-member img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffcc66;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }
        
        .staff-member:hover img {
            border-color: #ff8c42;
        }
        
        .staff-member h4 {
            color: #ff8c42;
            font-size: 1.6em;
            margin: 5px 0 10px;
        }
        

        .quote {
            color: #ffcc66; 
            font-style: italic;
            margin-top: 5px;
            margin-bottom: 10px;
            font-size: 0.95em; 
        }
        

        .staff-member p {
            font-size: 0.95em;
            line-height: 1.5;
            color: #ffffff; 
            margin-bottom: 5px; 
        }
        

footer {
            width: 90%;
            max-width: 800px; 
            margin-top: 40px;
            padding: 15px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 0.9em;
            color: #ffcc66;
            font-style: italic;
            text-align: center; 
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Handlee&display=swap" rel="stylesheet">
</head>
