<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Discord Server Stats</title>
  <style>
    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
      max-width: 800px;
      font-family: Arial, sans-serif;
    }
    .stat-card {
      background: #2f3136;
      color: #fff;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .stat-value {
      font-size: 2em;
      font-weight: bold;
      color: #5865f2;
      margin-top: 5px;
    }
  </style>
</head>
<body>

<div class="stats-container">
  <div class="stat-card">
    <div>總人數</div>
    <div class="stat-value" id="total-members">--</div>
  </div>
  <div class="stat-card">
    <div>真人數</div>
    <div class="stat-value" id="human-count">--</div>
  </div>
  <div class="stat-card">
    <div>機器人數</div>
    <div class="stat-value" id="bot-count">--</div>
  </div>
  <div class="stat-card">
    <div>頻道數</div>
    <div class="stat-value" id="channel-count">--</div>
  </div>
  <div class="stat-card">
    <div>加成數</div>
    <div class="stat-value" id="boost-count">--</div>
  </div>
</div>

<script>
  async function fetchServerStats() {
    try {
      const response = await fetch('https://mofox.xyz/api/server-stats');
      const data = await response.json();

      document.getElementById('total-members').innerText = data.totalMembers;
      document.getElementById('human-count').innerText = data.humanCount;
      document.getElementById('bot-count').innerText = data.botCount;
      document.getElementById('channel-count').innerText = data.channelCount;
      document.getElementById('boost-count').innerText = data.boostCount;
    } catch (err) {
      console.error(err);
    }
  }

  fetchServerStats();
  setInterval(fetchServerStats, 30000);
</script>

</body>
</html>
