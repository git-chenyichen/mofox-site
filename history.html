<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨狐酒館 | 歷程回顧</title>
    <link rel="icon" type="image/jpeg" href="images/mofox-logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f7f6f2;
            --card-bg: rgba(255, 255, 255, 0.85);
            --border: rgba(212, 203, 191, 0.5);
            --accent: #d97724;
            --accent-glow: rgba(217, 119, 36, 0.15);
            --text-main: #2c2c2c;
            --text-muted: #736d65;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Noto Serif TC', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .bg-blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(230,220,205,0.6) 0%, rgba(247,246,242,0) 70%);
            border-radius: 50%;
            z-index: -1;
            filter: blur(40px);
            animation: float 12s infinite alternate ease-in-out;
        }

        .bg-blob-1 { top: -100px; left: -100px; }
        .bg-blob-2 { bottom: -100px; right: -100px; animation-delay: -6s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.1); }
        }

        /* 導覽列容器 */
        .nav-container {
            width: 100%;
            max-width: 800px;
            padding: 24px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 100;
            opacity: 0;
            animation: fadeIn 1s forwards ease-out 0.2s;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 26px;
            height: 18px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 101;
        }

        .hamburger span {
            width: 100%;
            height: 2px;
            background-color: var(--text-main);
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .hamburger.active span:nth-child(1) {
            transform: translateY(8px) rotate(45deg);
            background-color: var(--accent);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: translateY(-8px) rotate(-45deg);
            background-color: var(--accent);
        }

        .nav-bar {
            display: flex;
            gap: 28px;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.95em;
            letter-spacing: 1px;
            padding: 6px 4px;
            position: relative;
            transition: color 0.3s ease;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 1px;
            background-color: var(--accent);
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        .nav-link:hover {
            color: var(--text-main);
        }

        .nav-link:hover::after, .nav-link.active::after {
            width: 100%;
        }

        .nav-link.active {
            color: var(--accent);
        }

        header {
            width: 90%;
            max-width: 720px;
            text-align: center;
            margin: 20px 0 40px;
            opacity: 0;
            animation: fadeInUp 1s forwards ease-out 0.4s;
        }

        .top-tag {
            font-family: 'Caveat', cursive;
            font-size: 1.5em;
            color: var(--accent);
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        h1 {
            font-family: 'Caveat', 'Noto Serif TC', serif;
            font-size: 3.2em;
            font-weight: 500;
            color: #1a1a1a;
            letter-spacing: 3px;
        }

        main {
            width: 90%;
            max-width: 620px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin-bottom: 60px;
            opacity: 0;
            animation: fadeInUp 1s forwards ease-out 0.6s;
        }

        .timeline-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px 36px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
            position: relative;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .timeline-container:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
        }

        .timeline {
            position: relative;
            padding-left: 28px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 7px;
            top: 8px;
            bottom: 8px;
            width: 1px;
            background: var(--border);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 32px;
        }

        .timeline-item:last-child {
            margin-bottom: 0;
        }

        .timeline-dot {
            position: absolute;
            left: -28px;
            top: 6px;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: var(--bg);
            border: 2px solid var(--accent);
            transition: background-color 0.3s ease;
        }

        .timeline-item:hover .timeline-dot {
            background: var(--accent);
        }

        .timeline-date {
            font-family: 'Caveat', serif;
            font-size: 1.25em;
            color: var(--accent);
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .timeline-title {
            font-size: 1.05em;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .timeline-desc {
            font-size: 0.9em;
            line-height: 1.7;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        footer {
            margin-top: auto;
            padding: 30px 0;
            text-align: center;
            font-size: 0.8em;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            opacity: 0;
            animation: fadeIn 1s forwards ease-out 0.8s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 響應式手機介面優化 */
        @media (max-width: 680px) {
            .nav-container {
                justify-content: flex-end;
                padding: 16px 20px;
            }

            .hamburger {
                display: flex;
            }

            .nav-bar {
                position: absolute;
                top: 100%;
                right: 20px;
                width: 200px;
                background: var(--card-bg);
                border: 1px solid var(--border);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                border-radius: 16px;
                padding: 12px 0;
                flex-direction: column;
                gap: 4px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.08);
                opacity: 0;
                visibility: hidden;
                transform: translateY(-10px);
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .nav-bar.active {
                opacity: 1;
                visibility: visible;
                transform: translateY(0);
            }

            .nav-link {
                padding: 12px 20px;
                text-align: center;
                display: block;
                font-size: 0.9em;
            }

            .nav-link::after {
                display: none;
            }

            header {
                margin: 10px 0 24px;
            }

            h1 {
                font-size: 2.4em;
            }

            .timeline-container {
                padding: 28px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-blob bg-blob-1"></div>
    <div class="bg-blob bg-blob-2"></div>

    <div class="nav-container">
        <button class="hamburger" id="hamburger-btn" aria-label="選單">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav class="nav-bar" id="nav-menu">
            <a href="index.html" class="nav-link">酒館主頁</a>
            <a href="staff.html" class="nav-link">館員團隊</a>
            <a href="history.html" class="nav-link active">歷程回顧</a>
            <a href="reviews.html" class="nav-link">旅客評價</a>
        </nav>
    </div>

    <header>
        <div class="top-tag">Footprints & Memories</div>
        <h1>歷程回顧</h1>
    </header>

    <main>
        <div class="timeline-container">
            <div class="timeline">
                <div class="timeline-item">
                    <div class="timeline-dot"></div>
                    <div class="timeline-date">2025.06.09</div>
                    <div class="timeline-title">墨狐酒館 正式開業</div>
                    <div class="timeline-desc">在迷霧之中點亮第一盞燈，為無處安放的靈魂提供了一處溫暖庇護所。</div>
                </div>

                <div class="timeline-item">
                    <div class="timeline-dot"></div>
                    <div class="timeline-date">2025.09.15</div>
                    <div class="timeline-title">專區與系統建立</div>
                    <div class="timeline-desc">逐步豐富酒館設施，陸續設立情感角落、深夜探索區與虛擬打工商店。</div>
                </div>

                <div class="timeline-item">
                    <div class="timeline-dot"></div>
                    <div class="timeline-date">2026.02.17</div>
                    <div class="timeline-title">新春慶典與社群盛會</div>
                    <div class="timeline-desc">舉辦馬年新春社群活動，吸引許多旅人聚首共飲，寫下熱鬧溫馨的篇章。</div>
                </div>

                <div class="timeline-item">
                    <div class="timeline-dot"></div>
                    <div class="timeline-date">2026.06.09</div>
                    <div class="timeline-title">一週年紀念</div>
                    <div class="timeline-desc">感謝每一位曾停下腳步的旅人，酒館依然會在每一個深夜為你守候。</div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        墨狐酒館．MoFox Tavern · Since 2025.06.09
    </footer>

    <script>
        const btn = document.getElementById('hamburger-btn');
        const menu = document.getElementById('nav-menu');

        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            btn.classList.toggle('active');
            menu.classList.toggle('active');
        });

        document.addEventListener('click', (e) => {
            if (!menu.contains(e.target) && !btn.contains(e.target)) {
                btn.classList.remove('active');
                menu.classList.remove('active');
            }
        });
    </script>
</body>
</html>
