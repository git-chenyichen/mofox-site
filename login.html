<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帳號登入 | 墨狐酒館</title>
    <style>
        body {
            color: #ffffff;
            font-family: 'Avenir', 'Georgia', serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('images/mofox-background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: -1;
        }
        .login-box {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        .logo-img {
            width: 120px;
            margin-bottom: 15px;
            border-radius: 15px;
        }
        h2 { color: #ffcc66; margin-bottom: 25px; margin-top: 0; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; color: #ffe6c7; font-size: 0.9em; }
        select, input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: rgba(255, 255, 255, 0.9);
            color: #333;
            box-sizing: border-box;
        }
        .login-submit {
            width: 100%;
            padding: 12px;
            background-color: #ff8c42;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1em;
            margin-top: 10px;
        }
        .login-submit:hover { background-color: #cc6600; }
        .divider {
            margin: 25px 0;
            position: relative;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }
        .discord-btn {
            width: 100%;
            padding: 12px;
            background-color: #5865F2;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background-color 0.2s;
        }
        .discord-btn:hover { background-color: #4752c4; }
        .discord-btn img { height: 20px; width: auto; }
        .back-link { display: block; margin-top: 20px; color: #ffcc66; text-decoration: none; font-size: 0.85em; }
    </style>
</head>
<body>

<div class="login-box">
    <img src="images/DECISION-MAKING-TEAM-logo.png" alt="Mofox Logo" class="logo-img">
    
    <h2>Mofox 管理員認證系統</h2>
    
    <form id="loginForm">
        <div id="step-1">
            <div class="form-group">
                <label>登入身分</label>
                <select id="role">
                    <option value="OWNER">館主</option>
                    <option value="STAFF">館員</option>
                    <option value="ADMIN">網站負責人員</option>
                </select>
            </div>
            <div class="form-group">
                <label>用戶名稱</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label>密碼</label>
                <input type="password" id="password" required>
            </div>
        </div>

        <div id="step-2" style="display: none;">
            <div class="form-group">
                <label>Email 驗證碼</label>
                <input type="text" id="code" placeholder="請輸入 6 位代碼">
            </div>
        </div>

        <button type="submit" class="login-submit" id="submit-btn">下一步</button>
    </form>

    <div class="divider"></div>

    <button type="button" class="discord-btn" onclick="location.href='https://www.mofox.xyz/api/auth'">
        <img src="/images/discord_login_button.png" alt="Discord">
        Discord 登入
    </button>

    <a href="staff.html" class="back-link">返回團隊頁面</a>
</div>

<script>
    let currentStep = 'auth';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {
            step: currentStep,
            role: document.getElementById('role').value,
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
            code: document.getElementById('code').value
        };

        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        const result = await res.json();

        if (res.ok) {
            if (result.nextStep === '2fa') {
                currentStep = 'verify';
                document.getElementById('step-1').style.display = 'none';
                document.getElementById('step-2').style.display = 'block';
                document.getElementById('submit-btn').innerText = '完成登入';
            } else {
                window.location.href = '/admin-content.html';
            }
        } else {
            alert(result.message);
        }
    });
</script>

</body>
</html>
