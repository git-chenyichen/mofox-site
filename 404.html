<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 找不到頁面</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
            font-family: Arial, sans-serif;
        }

        .background-image-container {
            position: fixed; 
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; 
            

            background-image: url('images/mofox-background.jpg'); 
            
            background-size: cover;
            background-position: center;


            filter: blur(8px);
            transform: scale(1.05); 
        }


        .content {
            position: relative; 
            text-align: center;
            color: white; 
            padding: 40px;
            border-radius: 10px;
            

            background: rgba(0, 0, 0, 0.5); 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);

            backdrop-filter: blur(5px); 
            -webkit-backdrop-filter: blur(5px); 
        }

        .content h1 {
            font-size: 6em;
            margin-bottom: 0.1em;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 1);
        }

        .content p {
            font-size: 1.2em;
            margin-top: 0;
            margin-bottom: 2em;
        }

        .home-button {
            display: inline-block;
            padding: 10px 25px;
            background-color: #007bff; 
            color: white;
            text-decoration: none;
            border-radius: 50px; 
            font-size: 1.1em;
            transition: background-color 0.3s ease;
        }

        .home-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="background-image-container">
        </div>

    <div class="content">
        <h1>404</h1>
        <p>抱歉，您請求的頁面找不到。</p>
        <p>請檢查網址是否有誤，或點擊下方返回首頁按鈕返回安全區域。</p>
        <p>若您是館員可以點擊下方返回後台按鈕返回後台。</p>
        <a href="/" class="home-button">返回首頁</a>
        <a href="/" class="home-button">返回後台</a>
    </div>
</body>
</html>
