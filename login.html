<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSO 登入 | 墨狐酒館</title>
    <style>
        body {
            color: #ffffff;
            font-family: 'Avenir', 'Georgia', serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('images/mofox-background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: -1;
        }

        .login-box {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h2 { color: #ffcc66; margin-bottom: 30px; }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ffe6c7;
            font-size: 0.9em;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: rgba(255, 255, 255, 0.9);
            color: #333;
            box-sizing: border-box;
        }

        .login-submit {
            width: 100%;
            padding: 12px;
            background-color: #ff8c42;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            font-size: 1em;
            margin-top: 10px;
        }

        .login-submit:hover {
            background-color: #cc6600;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            color: #ffcc66;
            text-decoration: none;
            font-size: 0.85em;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Mofox SSO 驗證</h2>
    <form id="loginForm">
        <div class="form-group">
            <label>登入身分</label>
            <select id="role">
                <option value="OWNER">館主</option>
                <option value="STAFF">館員</option>
                <option value="ADMIN">網站負責人員</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>用戶名稱</label>
            <input type="text" id="username" required>
        </div>

        <div class="form-group">
            <label>密碼</label>
            <input type="password" id="password" required>
        </div>

        <button type="submit" class="login-submit">進行驗證</button>
    </form>
    <a href="staff.html" class="back-link">返回團隊頁面</a>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const loginData = {
            role: document.getElementById('role').value,
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
        };

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(loginData)
            });

            const result = await response.json();

            if (response.ok && result.success) {
                alert('驗證成功');
                window.location.href = '/admin.html';
            } else {
                alert('驗證失敗：' + result.message);
            }
        } catch (error) {
            alert('系統錯誤');
        }
    });
</script>

</body>
</html>
