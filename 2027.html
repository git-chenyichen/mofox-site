<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨狐酒館 | 2027 跨年盛典</title>
    <link rel="icon" type="image/png" href="images/mofox-logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Handlee&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            color: #ffffff; 
            font-family: 'Avenir', 'Georgia', serif; 
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            background-image: url('images/mofox-background.jpg'); 
            background-size: cover; 
            background-position: center center; 
            background-attachment: fixed; 
        }
        
        body::before {
            content: '';
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.4); 
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px); 
            z-index: -1; 
        }

        .nav-bar {
            width: 100%;
            background-color: rgba(0, 0, 0, 0.2); 
            padding: 10px 0;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            order: -1; 
        }
                  
        .nav-link {
            text-decoration: none;
            color: #ffcc66;
            font-weight: bold;
            font-size: 1.1em;
            padding: 8px 15px;
            margin: 0 15px;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
        }

        .nav-link:hover {
            background-color: #ff8c42;
            color: #ffffff;
            transform: scale(1.05) translateY(-1px);
        }

        .nav-link.active {
            background-color: #cc6600;
            color: #ffffff;
            border-bottom: 2px solid #ffcc66;
        }

        .countdown-section {
            margin: 60px 0 30px;
            width: 90%;
            max-width: 800px;
        }

        h1 {
            font-size: 3em;
            color: #ffe6c7;
            font-family: 'Handlee', cursive;
            text-shadow: 0 0 15px rgba(255, 140, 66, 0.6);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2em;
            color: #ffcc66;
            font-style: italic;
            margin-bottom: 40px;
        }

        .timer-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            min-width: 100px;
            border: 1px solid rgba(255, 204, 102, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .time-num {
            display: block;
            font-size: 3.5em;
            font-weight: bold;
            color: #ffffff;
            font-family: 'Handlee', cursive;
            text-shadow: 0 0 10px #ff8c42;
        }

        .time-label {
            font-size: 0.8em;
            color: #ffcc66;
            letter-spacing: 2px;
        }

        #new-year-msg {
            display: none;
            font-size: 3.5em;
            color: #ffcc66;
            font-family: 'Handlee', cursive;
            animation: glow 2s infinite;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px gold; transform: scale(1); }
            50% { text-shadow: 0 0 30px #ff8c42; transform: scale(1.05); }
        }

        .action-area {
            margin-top: 20px;
        }

        .join-button {
            display: inline-block;
            padding: 15px 40px;
            background-color: #ff8c42;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.3em;
            transition: all 0.3s;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }

        .join-button:hover {
            background-color: #ff703f;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        footer {
            margin-top: auto;
            padding: 30px;
            width: 90%;
            border-top: 1px solid rgba(255,255,255,0.2);
            color: #ffcc66;
            font-style: italic;
        }

        @media (max-width: 600px) {
            .timer-grid { gap: 10px; }
            .time-box { min-width: 70px; padding: 10px; }
            .time-num { font-size: 2em; }
        }
    </style>
    <script>
      window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>

    <div class="nav-bar">
        <a href="index.html" class="nav-link">酒館主頁</a>
        <a href="staff.html" class="nav-link">館員團隊</a>
        <a href="history.html" class="nav-link">歷程回顧</a>
        <a href="reviews.html" class="nav-link">旅客評價</a>
        <a href="2026.html" class="nav-link active">跨年盛典</a>
        <a href="feedback.html" class="nav-link">用戶回饋</a>
    </div>

    <main class="countdown-section">
        <header>
            <h1>MoFox 2027 跨年盛典</h1>
            <div class="subtitle">「一杯曖昧，敬過去的遺憾；一場煙火，迎未來的微光」</div>
        </header>

        <div id="countdown-display">
            <div class="timer-grid">
                <div class="time-box">
                    <span class="time-num" id="days">00</span>
                    <span class="time-label">DAYS</span>
                </div>
                <div class="time-box">
                    <span class="time-num" id="hours">00</span>
                    <span class="time-label">HOURS</span>
                </div>
                <div class="time-box">
                    <span class="time-num" id="minutes">00</span>
                    <span class="time-label">MINS</span>
                </div>
                <div class="time-box">
                    <span class="time-num" id="seconds">00</span>
                    <span class="time-label">SECS</span>
                </div>
            </div>
        </div>

        <div id="new-year-msg">
            Happy New Year 2027 <br>
            <span style="font-size: 0.4em;">歡迎來到墨狐的新時代</span>
        </div>

        <div class="action-area">
            <a href="https://discord.gg/mofox" target="_blank" class="join-button">
                進入酒館一起跨年 
            </a>
        </div>
    </main>
    
    <script>
        function updateTimer() {
            const target = new Date("January 1, 2027 00:00:00").getTime();
            
            const timer = setInterval(function() {
                const now = new Date().getTime();
                const diff = target - now;

                if (diff <= 0) {
                    clearInterval(timer);
                    document.getElementById("countdown-display").style.display = "none";
                    document.getElementById("new-year-msg").style.display = "block";
                    return;
                }

                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById("days").innerText = String(d).padStart(2, '0');
                document.getElementById("hours").innerText = String(h).padStart(2, '0');
                document.getElementById("minutes").innerText = String(m).padStart(2, '0');
                document.getElementById("seconds").innerText = String(s).padStart(2, '0');
            }, 1000);
        }

        updateTimer();
    </script>
</body>
</html>
