<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨狐酒館管理系統 v4.1</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #161b22;
            --text-main: #e6edf3;
            --accent-gold: #ffcc66;
            --border: #30363d;
        }

        body {
            font-family: "Segoe UI", system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .landing-card {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border);
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        h1 { color: var(--accent-gold); font-size: 1.8rem; margin-bottom: 20px; }
        
        .usage-box {
            text-align: left;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .btn-login {
            display: inline-block;
            background: var(--accent-gold);
            color: #000;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
            transition: transform 0.2s;
        }

        .btn-login:hover { transform: scale(1.05); }

        footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #8b949e;
        }

        footer a { color: var(--accent-gold); text-decoration: none; margin: 0 10px; }
    </style>
</head>
<body>

<div class="landing-card">
    <h1>墨狐酒館管理系統 v4.1</h1>
    
    <div class="usage-box">
        <p><strong>應用程式用途說明：</strong></p>
        <p>本系統為「墨狐酒館 (MoFox Pub)」Discord 社群之內部管理工具。提供授權管理員執行以下功能：</p>
        <ul>
            <li>同步 Discord 伺服器成員數據</li>
            <li>進行管理員身份驗證 (Google OAuth)</li>
            <li>發送系統廣播與維護社群秩序</li>
        </ul>
        <p>我們僅會存取您的 Google Email 地址以確認您是否在管理員白名單內，不會將資訊用於其他用途。</p>
    </div>

    <a href="https://mofox.xyz/admin.html" class="btn-login">進入管理後台</a>

    <footer>
        <p>© 2026 MoFox Team</p>
        <a href="https://mofox.xyz/privacy.html">隱私權政策 (Privacy Policy)</a> | 
        <a href="https://mofox.xyz/terms.html">服務條款 (TOS)</a>
    </footer>
</div>

</body>
</html>
