<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨狐酒館後台管理</title>
    <style>
        /* 基礎樣式與主題 */
        body {
            font-family: Arial, sans-serif;
            background-color: #2c2f33; /* Discord 暗色主題 */
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            width: 100%;
            background-color: #23272a;
            padding: 20px 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        h1 {
            color: #7289DA; /* Discord 藍色 */
            margin: 0;
            font-size: 2.5em;
        }
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }
        
        /* 模組樣式 */
        .module {
            background-color: #36393f;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
        }
        .module h2 {
            color: #ffcc66; /* 酒館主題金色 */
            border-bottom: 2px solid #4f545c;
            padding-bottom: 10px;
            margin-top: 0;
        }
        
        /* 表單元素 */
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            color: #b9bbbe;
        }
        input[type="text"], textarea, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #4f545c;
            border-radius: 5px;
            background-color: #40444b;
            color: #ffffff;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        button {
            background-color: #7289DA;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            margin-right: 10px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #677bc4;
        }

        /* 統計數據特別樣式 */
        .stats-grid {
            display: flex;
            justify-content: space-around;
            text-align: center;
            gap: 20px;
        }
        .stat-card {
            background-color: #40444b;
            padding: 15px;
            border-radius: 8px;
            flex-grow: 1;
        }
        .stat-card p {
            font-size: 1.1em;
            color: #b9bbbe;
            margin-bottom: 5px;
        }
        .stat-card strong {
            display: block;
            font-size: 2.5em;
            color: #ffcc66;
        }

        /* 錯誤/成功訊息 */
        #message-area {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            color: white;
            display: none;
            text-align: left;
        }
        .success {
            background-color: #43b581; /* 綠色成功 */
        }
        .error {
            background-color: #f04747; /* 紅色錯誤 */
        }
    </style>
</head>
<body>
    <header>
        <h1>墨狐酒館 🦊 後台管理系統</h1>
    </header>

    <div class="container">
        
        <div id="stats-module" class="module">
            <h2>📈 群組統計數據</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <p>總成員數</p>
                    <strong id="total-members">N/A</strong>
                </div>
                <div class="stat-card">
                    <p>在線人數</p>
                    <strong id="online-members">N/A</strong>
                </div>
                <div class="stat-card">
                    <p>身分組數量</p>
                    <strong id="total-roles">N/A</strong>
                </div>
            </div>
            <button id="refresh-stats">重新整理數據</button>
        </div>

        <div id="member-module" class="module">
            <h2>👤 成員操作 (踢人/封鎖)</h2>
            <label for="member-id">目標用戶 ID (UID)：</label>
            <input type="text" id="member-id" placeholder="例如: 123456789012345678">
            <label for="reason">原因 (可選)：</label>
            <input type="text" id="reason" placeholder="例如: 違反規則">
            
            <button id="kick-button" style="background-color: #faa61a;">踢出群組 (Kick)</button>
            <button id="ban-button" style="background-color: #f04747;">封鎖用戶 (Ban)</button>
        </div>
        
        <div id="role-module" class="module">
            <h2>🏷️ 身分組操作</h2>
            <p style="color: #b9bbbe; font-size: 0.9em;">注意：此功能需額外 API 函數處理賦予/移除身分組邏輯。</p>
            <label for="role-member-id">目標用戶 ID (UID)：</label>
            <input type="text" id="role-member-id" placeholder="輸入要操作的用戶 ID">
            <label for="role-select">選擇身分組：</label>
            <select id="role-select">
                <option value="" disabled selected>請先讀取身分組列表...</option>
            </select>
            
            <button id="add-role-button">賦予身分組</button>
            <button id="remove-role-button" style="background-color: #99aab5;">移除身分組</button>
        </div>

        <div id="message-module" class="module">
            <h2>✉️ 訊息發送 (以 Bot 名義)</h2>
            <label for="channel-id">頻道 ID：</label>
            <input type="text" id="channel-id" placeholder="輸入發送目標頻道 ID">
            <label for="message-content">訊息內容：</label>
            <textarea id="message-content" placeholder="輸入您要 Bot 發送的訊息..."></textarea>
            
            <button id="send-message-button">發送訊息</button>
        </div>

        <div id="webhook-module" class="module">
            <h2>🔗 Webhook 測試發送</h2>
            <p style="color: #b9bbbe; font-size: 0.9em;">注意：此功能假定 Webhook URL 已存在且可訪問。</p>
            <label for="webhook-url">Webhook URL：</label>
            <input type="text" id="webhook-url" placeholder="輸入完整的 Webhook URL">
            <label for="webhook-content">發送內容：</label>
            <textarea id="webhook-content" placeholder="輸入要通過 Webhook 發送的訊息..."></textarea>

            <button id="test-webhook-button">測試發送 Webhook</button>
        </div>

        <div id="message-area">
            操作結果將顯示在這裡。
        </div>

    </div>

    <footer>
        <p style="color: #b9bbbe;">請確保所有操作均遵守 Discord 服務條款。</p>
        <p><a href="/staff.html" style="color: #7289DA; text-decoration: none;">返回團隊頁面</a></p>
    </footer>

    <script>
        // Serverless API 端點定義
        const API_ENDPOINTS = {
            GET_STATS: '/api/get-stats',
            KICK: '/api/kick-member',
            BAN: '/api/ban-member', // 假設您創建了這個 API
            SEND_MESSAGE: '/api/send-message',
            // ... 其他 API
        };

        // 顯示操作訊息
        const showMessage = (message, type = 'success') => {
            const msgArea = document.getElementById('message-area');
            msgArea.textContent = message;
            msgArea.className = type; // 設置背景顏色
            msgArea.style.display = 'block';
            setTimeout(() => {
                msgArea.style.display = 'none';
            }, 5000);
        };

        // 執行 API POST 請求的通用函數
        const apiPost = async (endpoint, data) => {
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            
            if (!response.ok) {
                // 如果 HTTP 狀態碼不是 2xx，拋出錯誤
                throw new Error(result.error || `操作失敗 (${response.status})`);
            }
            return result;
        };

        // ----------------------------------------------------
        // 模組 1: 統計數據邏輯
        // ----------------------------------------------------
        const refreshStats = async () => {
            document.getElementById('total-members').textContent = '讀取中...';
            document.getElementById('online-members').textContent = '讀取中...';
            document.getElementById('total-roles').textContent = '讀取中...';

            try {
                const response = await fetch(API_ENDPOINTS.GET_STATS);
                const data = await response.json();

                if (!response.ok) throw new Error(data.error || '無法讀取數據');
                
                // 更新介面上的數據
                document.getElementById('total-members').textContent = data.totalMembers || 'N/A';
                document.getElementById('online-members').textContent = data.onlineMembers || 'N/A';
                document.getElementById('total-roles').textContent = data.totalRoles || 'N/A';

                showMessage("統計數據已成功更新。", 'success');

            } catch (error) {
                console.error("無法讀取統計數據:", error);
                document.getElementById('total-members').textContent = '錯誤';
                document.getElementById('online-members').textContent = '錯誤';
                document.getElementById('total-roles').textContent = '錯誤';
                showMessage(`讀取統計數據失敗: ${error.message}`, 'error');
            }
        };

        // ----------------------------------------------------
        // 模組 2: 成員操作邏輯
        // ----------------------------------------------------
        const handleMemberAction = async (action) => {
            const userId = document.getElementById('member-id').value.trim();
            const reason = document.getElementById('reason').value.trim();
            
            if (!userId) {
                return showMessage('請輸入目標用戶 ID。', 'error');
            }

            try {
                const endpoint = action === 'kick' ? API_ENDPOINTS.KICK : API_ENDPOINTS.BAN;
                
                const result = await apiPost(endpoint, { userId, reason });
                
                showMessage(result.message, 'success');

            } catch (error) {
                showMessage(`${action === 'kick' ? '踢出' : '封鎖'}失敗: ${error.message}`, 'error');
            }
        };


        // ----------------------------------------------------
        // 模組 4: 訊息發送邏輯
        // ----------------------------------------------------
        const handleSendMessage = async () => {
            const channelId = document.getElementById('channel-id').value.trim();
            const content = document.getElementById('message-content').value.trim();

            if (!channelId || !content) {
                return showMessage('請輸入頻道 ID 和訊息內容。', 'error');
            }

            try {
                const result = await apiPost(API_ENDPOINTS.SEND_MESSAGE, { channelId, content });
                showMessage(result.message, 'success');
            } catch (error) {
                showMessage(`發送訊息失敗: ${error.message}`, 'error');
            }
        };

        // ----------------------------------------------------
        // 模組 5: Webhook 測試邏輯 (純前端發送)
        // ----------------------------------------------------
        const handleWebhookTest = async () => {
            const webhookUrl = document.getElementById('webhook-url').value.trim();
            const content = document.getElementById('webhook-content').value.trim();

            if (!webhookUrl || !content) {
                return showMessage('請輸入 Webhook URL 和發送內容。', 'error');
            }

            try {
                // 直接向 Webhook URL 發送 POST 請求 (注意 CORS 問題，如果發生錯誤可能需要 Serverless 中轉)
                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: content })
                });

                if (response.ok) {
                    showMessage('Webhook 測試訊息發送成功！', 'success');
                } else {
                    showMessage(`Webhook 測試失敗: Discord 返回狀態碼 ${response.status}`, 'error');
                }
            } catch (error) {
                // 如果是網絡錯誤或 CORS 錯誤
                showMessage(`Webhook 測試失敗: 網絡錯誤或 URL 無效。`, 'error');
            }
        };


        // ----------------------------------------------------
        // 初始化與事件監聽
        // ----------------------------------------------------
        document.addEventListener('DOMContentLoaded', () => {
            // 頁面載入時，自動獲取統計數據
            refreshStats();

            // 統計數據按鈕
            document.getElementById('refresh-stats').addEventListener('click', refreshStats);

            // 成員管理按鈕
            document.getElementById('kick-button').addEventListener('click', () => handleMemberAction('kick'));
            // 🚨 需確認您已創建 /api/ban-member.js 函數
            document.getElementById('ban-button').addEventListener('click', () => handleMemberAction('ban'));

            // 訊息發送按鈕
            document.getElementById('send-message-button').addEventListener('click', handleSendMessage);

            // Webhook 測試按鈕
            document.getElementById('test-webhook-button').addEventListener('click', handleWebhookTest);
            
            // 💡 提示：身分組模組 (模組 3) 需複雜的 JS 邏輯來讀取所有身分組，此處省略。
            // 💡 提示：創建 Webhook 按鈕 (模組 5) 需 Serverless 函數來呼叫 Discord API，此處省略。
        });
    </script>
</body>
</html>
