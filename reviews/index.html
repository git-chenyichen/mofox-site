<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨狐酒館 | 旅客私語</title>
    <link rel="icon" type="image/jpeg" href="images/mofox-logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f7f6f2;
            --card-bg: rgba(255, 255, 255, 0.85);
            --border: rgba(212, 203, 191, 0.5);
            --accent: #d97724;
            --accent-glow: rgba(217, 119, 36, 0.15);
            --text-main: #2c2c2c;
            --text-muted: #736d65;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Noto Serif TC', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .bg-blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(230,220,205,0.6) 0%, rgba(247,246,242,0) 70%);
            border-radius: 50%;
            z-index: -1;
            filter: blur(40px);
            animation: float 12s infinite alternate ease-in-out;
        }

        .bg-blob-1 { top: -100px; left: -100px; }
        .bg-blob-2 { bottom: -100px; right: -100px; animation-delay: -6s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.1); }
        }

        .nav-container {
            width: 100%;
            max-width: 800px;
            padding: 24px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 100;
            opacity: 0;
            animation: fadeIn 1s forwards ease-out 0.2s;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 26px;
            height: 18px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 101;
        }

        .hamburger span {
            width: 100%;
            height: 2px;
            background-color: var(--text-main);
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .hamburger.active span:nth-child(1) {
            transform: translateY(8px) rotate(45deg);
            background-color: var(--accent);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: translateY(-8px) rotate(-45deg);
            background-color: var(--accent);
        }

        .nav-bar {
            display: flex;
            gap: 28px;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.95em;
            letter-spacing: 1px;
            padding: 6px 4px;
            position: relative;
            transition: color 0.3s ease;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 1px;
            background-color: var(--accent);
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        .nav-link:hover {
            color: var(--text-main);
        }

        .nav-link:hover::after, .nav-link.active::after {
            width: 100%;
        }

        .nav-link.active {
            color: var(--accent);
        }

        header {
            width: 90%;
            max-width: 720px;
            text-align: center;
            margin: 20px 0 40px;
            opacity: 0;
            animation: fadeInUp 1s forwards ease-out 0.4s;
        }

        .top-tag {
            font-family: 'Caveat', cursive;
            font-size: 1.5em;
            color: var(--accent);
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        h1 {
            font-family: 'Caveat', 'Noto Serif TC', serif;
            font-size: 3.2em;
            font-weight: 500;
            color: #1a1a1a;
            letter-spacing: 3px;
        }

        main {
            width: 90%;
            max-width: 580px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            margin-bottom: 60px;
            opacity: 0;
            animation: fadeInUp 1s forwards ease-out 0.6s;
        }

        .review-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            min-height: 280px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .review-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
        }

        .fade-animation {
            animation: cardFade 0.8s ease-in-out;
        }

        @keyframes cardFade {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-info {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            margin-right: 16px;
            border: 1px solid var(--border);
            object-fit: cover;
        }

        .nickname {
            color: var(--text-main);
            font-weight: 600;
            font-size: 1.05em;
            letter-spacing: 0.5px;
        }

        .star-container {
            font-size: 1.1em;
            letter-spacing: 3px;
            margin-bottom: 18px;
            line-height: 1;
        }

        .star-fill {
            color: var(--accent);
        }

        .star-empty {
            color: rgba(212, 203, 191, 0.6);
        }

        .comment {
            font-size: 0.95em;
            line-height: 1.8;
            color: var(--text-muted);
            white-space: pre-line;
            word-wrap: break-word;
            letter-spacing: 0.5px;
        }

        footer {
            margin-top: auto;
            padding: 30px 0;
            text-align: center;
            font-size: 0.8em;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            opacity: 0;
            animation: fadeIn 1s forwards ease-out 0.8s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 680px) {
            .nav-container {
                justify-content: flex-end;
                padding: 16px 20px;
            }

            .hamburger {
                display: flex;
            }

            .nav-bar {
                position: absolute;
                top: 100%;
                right: 20px;
                width: 200px;
                background: var(--card-bg);
                border: 1px solid var(--border);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                border-radius: 16px;
                padding: 12px 0;
                flex-direction: column;
                gap: 4px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.08);
                opacity: 0;
                visibility: hidden;
                transform: translateY(-10px);
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .nav-bar.active {
                opacity: 1;
                visibility: visible;
                transform: translateY(0);
            }

            .nav-link {
                padding: 12px 20px;
                text-align: center;
                display: block;
                font-size: 0.9em;
            }

            .nav-link::after {
                display: none;
            }

            header {
                margin: 10px 0 24px;
            }

            h1 {
                font-size: 2.4em;
            }

            .review-card {
                padding: 28px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-blob bg-blob-1"></div>
    <div class="bg-blob bg-blob-2"></div>

    <div class="nav-container">
        <button class="hamburger" id="hamburger-btn" aria-label="選單">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav class="nav-bar" id="nav-menu">
            <a href="/" class="nav-link">酒館主頁</a>
            <a href="staff" class="nav-link">館員團隊</a>
            <a href="history" class="nav-link">歷程回顧</a>
            <a href="reviews" class="nav-link active">旅客評價</a>
        </nav>
    </div>

    <header>
        <div class="top-tag">Whispers of Guests</div>
        <h1>旅客的私語</h1>
    </header>

    <main>
        <div id="card-content" class="review-card"></div>
    </main>

    <footer>
        墨狐酒館．MoFox Tavern · Since 2025.06.09
    </footer>

    <script>
        const btn = document.getElementById('hamburger-btn');
        const menu = document.getElementById('nav-menu');

        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            btn.classList.toggle('active');
            menu.classList.toggle('active');
        });

        document.addEventListener('click', (e) => {
            if (!menu.contains(e.target) && !btn.contains(e.target)) {
                btn.classList.remove('active');
                menu.classList.remove('active');
            }
        });

        const reviews = [
            {
                name: "館主 - 墨狐",
                avatar: "db/userimages/aea2d128b26891bde1d9dd6543b140c9.webp",
                stars: 5,
                text: "這是一間隱藏在塵世喧囂中的小酒館。\n有時人聲鼎沸、有時靜謐溫馨；\n有時歌聲悠揚、有時也會跑出奇特的聲音(？)。\n這裡的人們溫暖包容、多元接納，\n除了人類之外，亦存在著各種族 (w)。\n從小心翼翼地探頭，到像在家一般自在。\n歡迎光臨 —— 墨狐酒館"
            },
            { 
                name: "館員 - 2023", 
                avatar: "db/userimages/23b07317528941d276955bf64eecb7b9.webp", 
                stars: 5, 
                text: "這裡的氛圍真的好讚，\n放鬆聊天的首選。" 
            },
            { 
                name: "Ting", 
                avatar: "db/userimages/e287f972fdcf19867bfcd6fd1818577c.webp", 
                stars: 5, 
                text: "這是一個很溫暖每個人類都很友好的地方！\n也是一個治療心靈的好地方。" 
            },
            { 
                name: "小楓", 
                avatar: "db/userimages/51b4d03b7361cd5cb4d964fe1a50cbb1.webp", 
                stars: 5, 
                text: "在墨狐酒館你可以體驗到很多很多，裡面的酒客也都很和善、好相處呐。\n來到這邊就會捨不得離開拉（笑" 
            },
            { 
                name: "時汐",
                avatar: "db/userimages/49bad89e426e615297898f99da21d682.webp", 
                stars: 4, 
                text: "視他人的凝目如盞盞鬼火，大膽去走你的夜路。" 
            },
            { 
                name: "白鹿(布偶貓)",
                avatar: "db/userimages/7a3ce821635b02fd8c9221552d4ef53c.webp", 
                stars: 5, 
                text: "這是一間隱藏在塵世喧囂中的小酒館。\n有時人聲鼎沸、有時靜謐溫馨；\n有時歌聲悠揚、有時也會跑出奇特的聲音(像是破音🤣)\n除了人類之外，亦存在著各種族\n從小心翼翼地探頭，到像在家一般自在。\n這裡也能昌歌,特別自在~😊" 
            }
        ];

        let currentIndex = 0;

        function getStars(count) {
            let starsHTML = '<span class="star-fill">';
            for (let i = 0; i < count; i++) starsHTML += '★';
            starsHTML += '</span><span class="star-empty">';
            for (let i = 0; i < (5 - count); i++) starsHTML += '★';
            starsHTML += '</span>';
            return starsHTML;
        }

        function updateDisplay() {
            const data = reviews[currentIndex];
            const container = document.getElementById('card-content');
            
            container.classList.remove('fade-animation');
            void container.offsetWidth; 
            container.classList.add('fade-animation');

            container.innerHTML = `
                <div class="user-info">
                    <img src="${data.avatar}" class="avatar">
                    <span class="nickname">${data.name}</span>
                </div>
                <div class="star-container">${getStars(data.stars)}</div>
                <div class="comment">${data.text}</div>
            `;
            
            currentIndex = (currentIndex + 1) % reviews.length;
        }

        updateDisplay();
        setInterval(updateDisplay, 5000);
    </script>
</body>
</html>
