<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 找不到頁面 | 墨狐酒館 MoFox Tavern</title>
    <link rel="icon" type="image/jpeg" href="images/mofox-logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f7f6f2;
            --card-bg: rgba(255, 255, 255, 0.85);
            --border: rgba(212, 203, 191, 0.5);
            --accent: #d97724;
            --accent-glow: rgba(217, 119, 36, 0.15);
            --text-main: #2c2c2c;
            --text-muted: #736d65;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Noto Serif TC', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        .bg-blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(230,220,205,0.6) 0%, rgba(247,246,242,0) 70%);
            border-radius: 50%;
            z-index: -1;
            filter: blur(40px);
            animation: float 12s infinite alternate ease-in-out;
        }

        .bg-blob-1 { top: -100px; left: -100px; }
        .bg-blob-2 { bottom: -100px; right: -100px; animation-delay: -6s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.1); }
        }

        header {
            width: 100%;
            max-width: 600px;
            text-align: center;
            margin-bottom: 24px;
            opacity: 0;
            animation: fadeInUp 1s forwards ease-out 0.2s;
        }

        h1.error-code {
            font-family: 'Caveat', cursive;
            font-size: 7em;
            font-weight: 600;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .title-sub {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.5em;
            font-weight: 600;
            color: #1a1a1a;
            letter-spacing: 2px;
        }

        main {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            opacity: 0;
            animation: fadeInUp 1s forwards ease-out 0.4s;
        }

        .info-panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px 30px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
            text-align: center;
        }

        .error-desc {
            font-size: 0.95em;
            color: var(--text-muted);
            line-height: 1.8;
            letter-spacing: 0.5px;
        }

        .error-desc p {
            margin-bottom: 12px;
        }

        .error-desc p:last-child {
            margin-bottom: 0;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin-top: 28px;
        }

        .btn-primary {
            display: inline-block;
            padding: 12px 32px;
            background: #1a1a1a;
            color: #ffffff;
            border-radius: 40px;
            font-family: 'Caveat', 'Noto Serif TC', serif;
            font-size: 1.15em;
            text-decoration: none;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }

        .btn-primary:hover {
            background: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 12px 25px var(--accent-glow);
        }

        .btn-secondary {
            display: inline-block;
            padding: 12px 32px;
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 40px;
            font-family: 'Caveat', 'Noto Serif TC', serif;
            font-size: 1.15em;
            text-decoration: none;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.5);
        }

        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.8em;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            opacity: 0;
            animation: fadeIn 1s forwards ease-out 0.6s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 680px) {
            h1.error-code {
                font-size: 5.5em;
            }

            .title-sub {
                font-size: 1.3em;
            }

            .info-panel {
                padding: 28px 20px;
            }

            .button-group {
                flex-direction: column;
                gap: 12px;
            }

            .btn-primary, .btn-secondary {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="bg-blob bg-blob-1"></div>
    <div class="bg-blob bg-blob-2"></div>

    <header>
        <h1 class="error-code">404</h1>
        <div class="title-sub">迷失在迷霧中 · 頁面未找到</div>
    </header>

    <main>
        <section class="info-panel">
            <div class="error-desc">
                <p>抱歉，您請求的頁面不存在或已被轉移。</p>
                <p>請檢查網址是否有誤，或點擊下方按鈕返回安全區域。</p>
                <p style="font-size: 0.9em; color: var(--text-muted); opacity: 0.85; margin-top: 8px;">若您是館員，可使用 MoFox 帳號返回後台。</p>
            </div>

            <div class="button-group">
                <a href="/" class="btn-primary">返回首頁</a>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 墨狐酒館 MoFox Tavern. All Rights Reserved.</p>
    </footer>

</body>
</html>
