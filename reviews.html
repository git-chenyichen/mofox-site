<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅客私語 | 墨狐酒館</title>
    <link rel="icon" type="image/png" href="images/mofox-logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Handlee&display=swap" rel="stylesheet">
    
    <style>
        body {
            color: #ffffff; 
            font-family: 'Avenir', 'Georgia', serif; 
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            background-image: url('images/mofox-background.jpg'); 
            background-size: cover; 
            background-position: center center; 
            background-attachment: fixed; 
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px); 
            z-index: -2; 
        }

        .nav-bar {
            width: 100%;
            background-color: rgba(0, 0, 0, 0.3); 
            padding: 10px 0;
            display: flex;
            justify-content: center;
            z-index: 100;
        }
        
        .nav-link {
            text-decoration: none;
            color: #ffcc66;
            font-weight: bold;
            padding: 8px 15px;
            margin: 0 15px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .nav-link:hover {
            background-color: #ff8c42;
            color: #ffffff;
        }

        #float-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 95vw;
            height: 85vh;
            pointer-events: none;
            z-index: 1;
        }

        .review-card {
            position: absolute;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 204, 102, 0.2);
            padding: 12px;
            border-radius: 12px;
            width: 220px;
            display: flex;
            flex-direction: column;
            animation: float ease-in-out infinite;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .user-info {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        .avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            margin-right: 8px;
            border: 1px solid #ffcc66;
        }

        .nickname {
            color: #ffcc66;
            font-weight: bold;
            font-size: 0.85em;
        }

        .stars {
            color: #ff8c42;
            font-size: 0.75em;
            margin-bottom: 5px;
            text-align: left;
        }

        .comment {
            font-size: 0.8em;
            line-height: 1.4;
            text-align: left;
            color: #ddd;
        }

        @keyframes float {
            from { transform: translate(0, 0); }
            to { transform: translate(var(--move-x), var(--move-y)); }
        }

        header {
            margin-top: 60px;
            z-index: 10;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            color: #ffe6c7;
            font-family: 'Handlee', cursive;
            margin-bottom: 10px;
        }

        .center-box {
            position: relative;
            z-index: 10;
            margin-top: 20px;
            padding: 30px;
            border-top: 1px solid rgba(255, 204, 102, 0.3);
            border-bottom: 1px solid rgba(255, 204, 102, 0.3);
            max-width: 400px;
        }

        footer {
            position: fixed;
            bottom: 20px;
            color: #ffcc66;
            font-size: 0.85em;
            font-style: italic;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="index.html" class="nav-link">酒館主頁</a>
        <a href="staff.html" class="nav-link">館員團隊</a>
        <a href="history.html" class="nav-link">歷程回顧</a>
        <a href="reviews.html" class="nav-link" active>旅客評價</a>
    
    </div>

    <div id="float-container"></div>

    <header>
        <h1>旅人的私語</h1>
        <div class="center-box">
            <p style="color: #ffcc66; letter-spacing: 2px;">「在這裡，每一個靈魂的低喃都值得被聽見。」</p>
            <p style="font-size: 0.9em; color: #aaa;">酒館中迴盪著旅人們留下的故事...</p>
        </div>
    </header>

    <footer>
        墨狐酒館 | Since 2025.06.09
    </footer>

    <script>
        const reviews = [
            { name: "迷途旅人", avatar: "https://cdn.discordapp.com/embed/avatars/0.png", stars: 5, text: "這裡的氛圍真的好讚，放鬆聊天的首選。" },
            { name: "深夜貓貓", avatar: "https://cdn.discordapp.com/embed/avatars/1.png", stars: 4, text: "分區做得很用心，管理員很有溫度。" },
            { name: "狐狸大叔", avatar: "https://cdn.discordapp.com/embed/avatars/2.png", stars: 5, text: "酒館的音樂很好聽，在那裡待了一整晚。" },
            { name: "夢遊者", avatar: "https://cdn.discordapp.com/embed/avatars/3.png", stars: 5, text: "神祕區域真的很有趣...會再來！" },
            { name: "小酒鬼", avatar: "https://cdn.discordapp.com/embed/avatars/4.png", stars: 4, text: "雖然有點害羞，但大家人都很好。" },
            { name: "靈魂探險家", avatar: "https://cdn.discordapp.com/embed/avatars/5.png", stars: 5, text: "在這裡找到了久違的共鳴感。" },
            { name: "時光旅人", avatar: "https://cdn.discordapp.com/embed/avatars/0.png", stars: 5, text: "忙碌一整天後，最適合躲進來的地方。" }
        ];

        function createFloatingReview() {
            const container = document.getElementById('float-container');
            const rect = container.getBoundingClientRect();
            
            reviews.forEach((data) => {
                const card = document.createElement('div');
                card.className = 'review-card';
                
                const startX = Math.random() * (rect.width - 220);
                const startY = Math.random() * (rect.height - 100);
                
                const moveX = (Math.random() - 0.5) * 450 + 'px';
                const moveY = (Math.random() - 0.5) * 450 + 'px';
                
                const duration = 3 + Math.random() * 3 + 's';
                
                card.style.left = `${startX}px`;
                card.style.top = `${startY}px`;
                card.style.setProperty('--move-x', moveX);
                card.style.setProperty('--move-y', moveY);
                card.style.animationDuration = duration;
                card.style.animationIterationCount = 'infinite';
                card.style.animationDirection = 'alternate';

                const starHTML = '⭐'.repeat(data.stars);

                card.innerHTML = `
                    <div class="user-info">
                        <img src="${data.avatar}" class="avatar">
                        <span class="nickname">${data.name}</span>
                    </div>
                    <div class="stars">${starHTML}</div>
                    <div class="comment">${data.text}</div>
                `;

                container.appendChild(card);
            });
        }

        window.onload = createFloatingReview;
    </script>
</body>
</html>
