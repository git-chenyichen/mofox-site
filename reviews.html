<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅客私語 | 墨狐酒館</title>
    <link rel="icon" type="image/png" href="images/mofox-logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Handlee&display=swap" rel="stylesheet">
    
    <style>
        body {
            color: #ffffff; 
            font-family: 'Avenir', 'Georgia', serif; 
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            background-image: url('images/mofox-background.jpg'); 
            background-size: cover; 
            background-position: center center; 
            background-attachment: fixed; 
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px); 
            z-index: -2; 
        }

        .nav-bar {
            width: 100%;
            background-color: rgba(0, 0, 0, 0.2); 
            padding: 10px 0;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            order: -1; 
        }
        
        .nav-link {
            text-decoration: none;
            color: #ffcc66;
            font-weight: bold;
            font-size: 1.1em;
            padding: 8px 15px;
            margin: 0 15px;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s, transform 0.3s;
        }

        .nav-link:hover {
            background-color: #ff8c42;
            color: #ffffff;
            transform: scale(1.05) translateY(-1px);
        }

        .nav-link.active {
            background-color: #cc6600;
            color: #ffffff;
            border-bottom: 2px solid #ffcc66;
        }

        .scroll-wrapper {
            position: absolute;
            top: 60%;
            width: 100%;
            overflow: hidden;
            z-index: 1;
            padding: 40px 0;
        }

        #float-container {
            display: flex;
            width: max-content;
            animation: marquee-scroll 20s linear infinite;
        }

        .review-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 204, 102, 0.2);
            padding: 35px;
            border-radius: 25px;
            width: 400px;
            margin: 0 30px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }

        .user-info {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .avatar {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            margin-right: 20px;
            border: 2px solid #ffcc66;
        }

        .nickname {
            color: #ffcc66;
            font-weight: bold;
            font-size: 1.3em;
        }

        .stars {
            color: #ff8c42;
            font-size: 1.2em;
            margin-bottom: 12px;
            text-align: left;
        }

        .comment {
            font-size: 1.15em;
            line-height: 1.8;
            text-align: left;
            color: #eeeeee;
            white-space: normal;
        }

        @keyframes marquee-scroll {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0%); }
        }

        header {
            margin-top: 60px;
            z-index: 10;
            text-align: center;
        }

        h1 {
            font-size: 2.8em;
            color: #ffe6c7;
            font-family: 'Handlee', cursive;
            margin-bottom: 10px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }

        .center-box {
            position: relative;
            z-index: 10;
            margin-top: 20px;
            padding: 30px;
            border-top: 1px solid rgba(255, 204, 102, 0.3);
            border-bottom: 1px solid rgba(255, 204, 102, 0.3);
            max-width: 450px;
        }

        footer {
            position: fixed;
            bottom: 20px;
            color: #ffcc66;
            font-size: 0.9em;
            font-style: italic;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="index.html" class="nav-link">酒館主頁</a>
        <a href="staff.html" class="nav-link">館員團隊</a>
        <a href="history.html" class="nav-link">歷程回顧</a>
        <a href="reviews.html" class="nav-link active">旅客評價</a>
    </div>

    <div class="scroll-wrapper">
        <div id="float-container"></div>
    </div>

    <header>
        <h1>旅人的私語</h1>
        <div class="center-box">
            <p style="color: #ffcc66; letter-spacing: 2px; font-size: 1.1em;">「在這裡，每一個靈魂的低喃都值得被聽見。」</p>
            <p style="font-size: 0.95em; color: #aaa;">酒館中迴盪著旅人們留下的故事...</p>
        </div>
    </header>

    <footer>
        墨狐酒館 | Since 2025.06.09
    </footer>

    <script>
        const reviews = [
            { name: "2023", avatar: "https://cdn.discordapp.com/avatars/1191200148357910538/9066b691c0b376209b51833a4de5b1ac.png?size=1024", stars: 5, text: "這裡的氛圍真的好讚，放鬆聊天的首選。" },
            { name: "test1", avatar: "https://cdn.discordapp.com/embed/avatars/1.png", stars: 4, text: "1" },
            { name: "test2", avatar: "https://cdn.discordapp.com/embed/avatars/2.png", stars: 5, text: "2" },
            { name: "test3", avatar: "https://cdn.discordapp.com/embed/avatars/3.png", stars: 5, text: "3" },
            { name: "test4", avatar: "https://cdn.discordapp.com/embed/avatars/4.png", stars: 4, text: "4" },
            { name: "test5", avatar: "https://cdn.discordapp.com/embed/avatars/5.png", stars: 5, text: "5" },
            { name: "test6", avatar: "https://cdn.discordapp.com/embed/avatars/0.png", stars: 5, text: "6" }
        ];

        function createScrollingReviews() {
            const container = document.getElementById('float-container');
            const doubleReviews = [...reviews, ...reviews];
            
            doubleReviews.forEach((data) => {
                const card = document.createElement('div');
                card.className = 'review-card';
                
                const starHTML = '⭐'.repeat(data.stars);

                card.innerHTML = `
                    <div class="user-info">
                        <img src="${data.avatar}" class="avatar">
                        <span class="nickname">${data.name}</span>
                    </div>
                    <div class="stars">${starHTML}</div>
                    <div class="comment">${data.text}</div>
                `;

                container.appendChild(card);
            });
        }

        window.onload = createScrollingReviews;
    </script>
</body>
</html>
