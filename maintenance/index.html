<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="facebook-domain-verification" content="k2magj9bg5f6293zu46edn1etz4hob" />
    <title>系統維護中 - 墨狐酒館 MoFox Tavern</title>
    <link rel="icon" type="image/jpeg" href="../images/mofox-logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f7f6f2;
            --card-bg: rgba(255, 255, 255, 0.85);
            --border: rgba(212, 203, 191, 0.5);
            --accent: #d97724;
            --accent-glow: rgba(217, 119, 36, 0.15);
            --text-main: #2c2c2c;
            --text-muted: #736d65;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Noto Serif TC', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .bg-blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(230,220,205,0.6) 0%, rgba(247,246,242,0) 70%);
            border-radius: 50%;
            z-index: -1;
            filter: blur(40px);
            animation: float 12s infinite alternate ease-in-out;
        }

        .bg-blob-1 { top: -100px; left: -100px; }
        .bg-blob-2 { bottom: -100px; right: -100px; animation-delay: -6s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.1); }
        }

        header {
            width: 90%;
            max-width: 720px;
            text-align: center;
            margin: 60px 0 40px;
            opacity: 0;
            animation: fadeInUp 1s forwards ease-out 0.4s;
        }

        h1 {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            margin-bottom: 16px;
        }

        .title-main {
            font-family: 'Noto Serif TC', serif;
            font-size: 2.6em;
            font-weight: 600;
            color: #1a1a1a;
            letter-spacing: 4px;
            line-height: 1.1;
        }

        .title-sub {
            font-family: 'Caveat', cursive;
            font-size: 1.6em;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 2px;
            line-height: 1.1;
        }

        .subtitle {
            font-size: 0.9em;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            font-weight: 300;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        main {
            width: 90%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            gap: 32px;
            opacity: 0;
            animation: fadeInUp 1s forwards ease-out 0.6s;
        }

        .info-panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px 36px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
            text-align: center;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .info-panel:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
        }

        h2 {
            font-family: 'Caveat', 'Noto Serif TC', serif;
            font-size: 2em;
            font-weight: 500;
            color: #1a1a1a;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .intro-text {
            font-size: 1em;
            color: var(--text-muted);
            line-height: 1.8;
            margin-bottom: 28px;
            letter-spacing: 0.5px;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            background: var(--accent-glow);
            color: var(--accent);
            border: 1px solid rgba(217, 119, 36, 0.3);
            border-radius: 20px;
            font-size: 0.9em;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .footer-note {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            font-size: 0.88em;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .action-area {
            text-align: center;
            margin: 10px 0 40px;
        }

        .join-button {
            display: inline-block;
            padding: 14px 44px;
            background: #1a1a1a;
            color: #ffffff;
            border-radius: 40px;
            font-family: 'Caveat', 'Noto Serif TC', serif;
            font-size: 1.3em;
            text-shadow: none;
            text-decoration: none;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }

        .join-button:hover {
            background: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 12px 25px var(--accent-glow);
        }

        footer {
            margin-top: auto;
            padding: 30px 0;
            text-align: center;
            font-size: 0.8em;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            opacity: 0;
            animation: fadeIn 1s forwards ease-out 0.8s;
        }

        footer a {
            color: var(--text-muted);
            text-decoration: none;
            margin: 0 10px;
            transition: color 0.3s ease;
        }

        footer a:hover {
            color: var(--accent);
        }

        footer p {
            margin-top: 12px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 680px) {
            header {
                margin: 30px 0 24px;
            }
            .title-main {
                font-size: 2.1em;
            }
            .title-sub {
                font-size: 1.4em;
            }
            .info-panel {
                padding: 28px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-blob bg-blob-1"></div>
    <div class="bg-blob bg-blob-2"></div>

    <header>
        <h1>
            <span class="title-main">墨狐酒館</span>
            <span class="title-sub">MoFox Tavern</span>
        </h1>
        <div class="subtitle">
            <span>「一杯曖昧，讓靈魂在迷霧中自由共醉」</span>
        </div>
    </header>

    <main>
        <section class="info-panel">
            <div class="status-badge">SYSTEM MAINTENANCE</div>
            <h2>酒館暫時歇業整修中</h2>
            <p class="intro-text">
                因應 2026/10 資安危機<br>
                墨狐酒館目前正在進行內部維護。<br>
                請稍作等候，我們將以更好的面貌再次為您開啟大門。
            </p>
            <div class="footer-note">若有緊急事項，歡迎透過官方 Discord 社群與我們聯繫。</div>
        </section>

        <div class="action-area">
            <a href="https://discord.gg/HnQ7qQxmRG" target="_blank" class="join-button">前往 Discord 了解詳情</a>
        </div>
    </main>

    <footer>
        <p>© 2026 墨狐酒館 MoFox Tavern. All Rights Reserved.</p>
    </footer>

</body>
</html>
