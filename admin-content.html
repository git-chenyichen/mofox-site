<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>墨狐酒館管理系統 v4.1</title>
    <style>
        :root {
            --sidebar-width: 260px;
            --bg-dark: #0A0A0A;
            --card-bg: #1E1F22;
            --input-bg: #111214;
            --accent-gold: #ffcc66;
            --hover-gold: #f5b350;
            --active-gold: #e6a23c;
            --gold-shadow: rgba(255, 204, 102, 0.3);
            --text-main: #f2f3f5;
            --text-muted: #949ba4;
            --status-red: #da373c;
            --status-green: #248046;
            --border-light: rgba(255, 255, 255, 0.06);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            background: var(--bg-dark) url('images/mofox-background.jpg') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
        }

        nav {
            width: var(--sidebar-width);
            background: rgba(17, 18, 20, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            height: 100vh;
            position: fixed;
            left: 0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-light);
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 5px 0 30px rgba(0,0,0,0.5);
        }

        .nav-brand {
            padding: 40px 24px;
            font-size: 1.6em;
            font-weight: 800;
            color: var(--accent-gold);
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 0 0 15px var(--gold-shadow);
        }

        .nav-menu { flex-grow: 1; padding: 10px 0; }

        .nav-link {
            padding: 16px 28px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            font-size: 1.05em;
            font-weight: 500;
            border-left: 4px solid transparent;
        }

        .nav-link:hover { color: #fff; background: rgba(255, 204, 102, 0.04); }
        .nav-link.active { color: #fff; background: rgba(255, 204, 102, 0.08); border-left-color: var(--accent-gold); font-weight: 600; }

        .mobile-header {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 65px;
            background: rgba(17, 18, 20, 0.98);
            backdrop-filter: blur(10px);
            z-index: 900;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid var(--border-light);
            justify-content: space-between;
        }

        @media (max-width: 768px) {
            nav { transform: translateX(-100%); }
            nav.open { transform: translateX(0); }
            .mobile-header { display: flex; }
            main { margin-left: 0 !important; padding: 90px 18px 30px 18px !important; }
        }

        main {
            margin-left: var(--sidebar-width);
            flex-grow: 1;
            padding: 50px 60px;
            display: flex;
            justify-content: center;
        }

        .container { width: 100%; max-width: 1100px; }
        .module-section { display: none; }
        .module-section.active { display: block; animation: moduleFade 0.4s ease-out; }
        @keyframes moduleFade { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 35px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }

        h2 { color: #fff; margin-top: 0; margin-bottom: 30px; font-size: 1.8em; font-weight: 700; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 25px; }
        .stat-item {
            background: var(--input-bg);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid var(--border-light);
        }
        .stat-value { font-size: 3em; font-weight: 800; color: var(--accent-gold); text-shadow: 0 0 15px var(--gold-shadow); }

        .form-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 12px; font-size: 0.95em; color: var(--text-muted); font-weight: 600; }

        select, input, textarea {
            width: 100%;
            padding: 16px 20px;
            background: var(--input-bg);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        select:focus, input:focus { border-color: var(--accent-gold); }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        button { padding: 16px 20px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; text-transform: uppercase; transition: opacity 0.2s; }
        button:active { opacity: 0.7; }

        .btn-primary { background: linear-gradient(145deg, var(--accent-gold), var(--hover-gold)); color: #000; }
        .btn-danger { background: transparent; color: var(--status-red); border: 2px solid var(--status-red); }

        #toast {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            padding: 16px 30px; border-radius: 12px; display: none; z-index: 2000; font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .toast-success { background: rgba(36, 128, 70, 0.9); color: #fff; }
        .toast-error { background: rgba(218, 55, 60, 0.9); color: #fff; }

        .avatar-preview { width: 55px; height: 55px; border-radius: 50%; border: 2px solid var(--accent-gold); background: #000; margin-right: 15px; }
        .input-with-avatar { display: flex; align-items: center; }
    </style>
</head>
<body>

<div class="mobile-header">
    <div onclick="toggleMenu()" style="font-size: 1.6em; cursor: pointer; color: var(--accent-gold);">☰</div>
    <div style="color: var(--accent-gold); font-weight: 800;">墨狐酒館</div>
    <div style="width: 24px;"></div>
</div>

<nav id="sidebar">
    <div class="nav-brand">墨狐酒館</div>
    <div class="nav-menu">
        <div class="nav-link active" onclick="navTo('stats', this)">酒館數據</div>
        <div class="nav-link" onclick="navTo('members', this)">成員與懲處</div>
        <div class="nav-link" onclick="navTo('roles', this)">身分組權限</div>
        <div class="nav-link" onclick="navTo('msg', this)">廣播系統</div>
    </div>
    <div style="padding: 25px; border-top: 1px solid var(--border-light);">
        <button class="btn-danger" style="width:100%" onclick="logout()">安全登出</button>
    </div>
</nav>

<main>
    <div class="container">
        <section id="stats" class="module-section active">
            <div class="card">
                <h2>系統數據概覽</h2>
                <div class="stats-grid">
                    <div class="stat-item"><div>成員數量</div><div class="stat-value" id="s-members">---</div></div>
                    <div class="stat-item"><div>身分組數量</div><div class="stat-value" id="s-roles">---</div></div>
                </div>
                <button class="btn-primary" style="width:100%; margin-top:30px" onclick="loadData()">同步即時數據</button>
            </div>
        </section>

        <section id="members" class="module-section">
            <div class="card">
                <h2>成員懲處作業</h2>
                <div class="form-group">
                    <label>搜尋成員</label>
                    <input type="text" placeholder="輸入名稱搜尋..." onkeyup="filterSelect(this.value, 'm-target')" id="m-search">
                    <div class="input-with-avatar" style="margin-top:15px">
                        <img id="m-avatar" class="avatar-preview" src="https://cdn.discordapp.com/embed/avatars/0.png">
                        <select id="m-target" class="list-u" onchange="syncAvatar(this, 'm-avatar')"></select>
                    </div>
                </div>
                <div class="form-group"><label>理由</label><input type="text" id="m-reason" placeholder="請輸入理由..."></div>
                <div class="btn-group">
                    <button class="btn-primary" style="background:transparent; border:2px solid var(--accent-gold); color:var(--accent-gold)" onclick="execMember('kick')">KICK</button>
                    <button class="btn-danger" onclick="execMember('ban')">BAN</button>
                </div>
            </div>
        </section>

        <section id="roles" class="module-section">
            <div class="card">
                <h2>身分組權限更改</h2>
                <div class="form-group">
                    <label>搜尋成員</label>
                    <input type="text" placeholder="輸入名稱搜尋..." onkeyup="filterSelect(this.value, 'r-target')" id="r-search">
                    <div class="input-with-avatar" style="margin-top:15px">
                        <img id="r-avatar" class="avatar-preview" src="https://cdn.discordapp.com/embed/avatars/0.png">
                        <select id="r-target" class="list-u" onchange="syncAvatar(this, 'r-avatar')"></select>
                    </div>
                </div>
                <div class="form-group">
                    <label>選擇身分組</label>
                    <select id="r-role" class="list-r"></select>
                </div>
                <div class="btn-group">
                    <button class="btn-primary" onclick="execRole('add')">授予權限</button>
                    <button class="btn-danger" onclick="execRole('remove')">撤銷權限</button>
                </div>
            </div>
        </section>

        <section id="msg" class="module-section">
            <div class="card">
                <h2>系統廣播</h2>
                <div class="form-group"><label>頻道</label><select id="msg-ch" class="list-c"></select></div>
                <div class="form-group"><label>內容</label><textarea id="msg-ctx" rows="7" placeholder="輸入要廣播的內容..."></textarea></div>
                <button class="btn-primary" style="width:100%" onclick="execMsg()">發送廣播</button>
            </div>
        </section>
    </div>
</main>

<div id="toast"></div>

<script>
    let cacheUsers = [];

    function filterSelect(val, selectId) {
        const select = document.getElementById(selectId);
        const options = select.getElementsByTagName("option");
        const lowerVal = val.toLowerCase();
        let found = false;
        
        for (let opt of options) {
            const isMatch = opt.text.toLowerCase().includes(lowerVal);
            opt.style.display = isMatch ? "" : "none";
            if(isMatch && !found) {
                opt.selected = true;
                found = true;
            }
        }
        syncAvatar(select, selectId === 'm-target' ? 'm-avatar' : 'r-avatar');
    }

    function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); }

    function navTo(id, el) {
        document.querySelectorAll('.module-section').forEach(m => m.classList.remove('active'));
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
        if (window.innerWidth <= 768) toggleMenu();
    }

    function syncAvatar(selectEl, imgId) {
        const user = cacheUsers.find(u => u.id === selectEl.value);
        document.getElementById(imgId).src = user && user.avatar ? 
            `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=128` : 
            `https://cdn.discordapp.com/embed/avatars/0.png`;
    }

    function notify(m, e=false) {
        const t = document.getElementById('toast');
        t.textContent = m;
        t.className = e ? 'toast-error' : 'toast-success';
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }

    async function req(url, body = null) {
        const opt = { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json' } };
        if (body) opt.body = JSON.stringify(body);
        const res = await fetch(url, opt);
        if (res.status === 401) window.location.href = '/login.html';
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '操作失敗');
        return data;
    }

    async function loadData() {
        try {
            const [users, roles, channels] = await Promise.all([
                req('/api/list?type=users'),
                req('/api/list?type=roles'),
                req('/api/list?type=channels')
            ]);
            cacheUsers = users;
            document.getElementById('s-members').textContent = users.length;
            document.getElementById('s-roles').textContent = roles.length;
            
            const uHtml = users.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
            document.querySelectorAll('.list-u').forEach(s => { 
                s.innerHTML = uHtml; 
                syncAvatar(s, s.id === 'm-target' ? 'm-avatar' : 'r-avatar');
            });
            document.querySelector('.list-r').innerHTML = roles.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
            document.querySelector('.list-c').innerHTML = channels.map(c => `<option value="${c.id}"># ${c.name}</option>`).join('');
            notify('數據同步完成');
        } catch (e) { notify(e.message, true); }
    }

    async function execMember(action) {
        try {
            const res = await req('/api/member', { userId: document.getElementById('m-target').value, action, reason: document.getElementById('m-reason').value });
            notify(res.message);
        } catch (e) { notify(e.message, true); }
    }

    async function execRole(action) {
        try {
            const res = await req('/api/role', { userId: document.getElementById('r-target').value, roleId: document.getElementById('r-role').value, action });
            notify(res.message);
        } catch (e) { notify(e.message, true); }
    }

    async function execMsg() {
        try {
            const res = await req('/api/msg', { channelId: document.getElementById('msg-ch').value, content: document.getElementById('msg-ctx').value });
            notify(res.message);
        } catch (e) { notify(e.message, true); }
    }

    function logout() {
        window.location.href = '/api/logout';
    }

    window.onload = loadData;
</script>
</body>
</html>
